name: Kortkollen

on:
  push:
    branches: [main]
    paths: ['kortkollen/**', '.github/workflows/kortkollen.yml']
  pull_request:
    paths: ['kortkollen/**', '.github/workflows/kortkollen.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kortkollen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Publishes the app to GitHub Pages (https://<user>.github.io/<repo>/).
  # One-time setup: Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r kortkollen/index.html kortkollen/manifest.webmanifest kortkollen/sw.js kortkollen/css kortkollen/js kortkollen/icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
